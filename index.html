/* Layout: one narrow column, phone first. Header with date + 4 tabs, one view at a time, toast at the bottom. */
:root {

  --ink: #14262B;

}
@media (prefers-color-scheme: dark) {

}

}
* { box-sizing: border-box; }
body {

}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 22px; }
.brand .sync { font-size: 12px; color: var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tab { border: 0; background: transparent; padding: 9px 0; border-radius: 9px; color: var(--muted); font-weight: 500; font-size: 13px; min-width: 0; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.banner { background: var(--slip-soft); color: var(--ink); border: 1px solid var(--slip); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 17px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.datenav { display: flex; align-items: center; gap: 8px; }
.datelabel { flex: 1; text-align: center; min-width: 0; }
.dl-main { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.dl-sub { font-size: 13px; color: var(--muted); }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; flex: none; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; text-decoration: underline; }

.weekchips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wchip { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 0; font-weight: 600; font-size: 14px; }
.wchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task.tpl { grid-template-columns: minmax(0, 1fr) 32px; }
.progress { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .25s; }
.pmeta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: 24px minmax(0, 1fr) 32px; gap: 4px 8px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); margin: 7px 0 0; }
.field { border: 1px solid transparent; border-bottom-color: var(--line); background: transparent; border-radius: 8px; padding: 7px 8px; min-width: 0; width: 100%; }
.field:hover, .field:focus { border-color: var(--line); background: var(--bg); }
.task .t-time { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.task.done .t-text { text-decoration: line-through; color: var(--muted); }
.x { width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; }
.x:hover { background: var(--slip-soft); color: var(--slip); }

.addrow { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: 8px; }
.input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; min-width: 0; width: 100%; }
textarea.input { resize: vertical; min-height: 88px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--slip); color: var(--slip); background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.streak { display: flex; align-items: center; gap: 16px; }
.streak .num { font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: 1; color: var(--good); font-variant-numeric: tabular-nums; }
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vbtn { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 14px 8px; font-weight: 600; }
.vbtn.good[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.vbtn.slip[aria-pressed="true"] { background: var(--slip-soft); border-color: var(--slip); color: var(--slip); }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dow { text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.cell { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-variant-numeric: tabular-nums; padding: 0; }
.cell.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.cell.slip { background: var(--slip-soft); border-color: var(--slip); color: var(--slip); }
.cell.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.today { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.dot.good { background: var(--good); } .dot.slip { background: var(--slip); } .dot.none { background: var(--line); }
.slips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.slips li { border-left: 3px solid var(--slip); padding-left: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 5px 10px; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; }
.chip img { display: block; height: 56px; border-radius: 6px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.dayhead { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--muted); margin-top: 4px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.entry .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.badge { background: var(--soft); color: var(--accent); border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
.entry .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.media img, .media video { width: 100%; max-height: 360px; object-fit: cover; border-radius: 10px; background: var(--soft); display: block; }
.media video { object-fit: contain; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 14px; }

.meter { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); }

.toast { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.toast div { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; max-width: 520px; }
.toast div.err { background: var(--slip); color: #fff; }
@media (max-width: 420px) {

[hidden] { display: none !important; }

.t-time { padding-left: 6px; padding-right: 4px; font-size: 14px; }

.dur { color: var(--muted); font-size: 13px; white-space: nowrap; }

.task .x { margin-top: 2px; }
.addgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.addgrid .wide { grid-column: 1 / -1; }
.bell { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.bell[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.meter.warn > div { background: var(--warn); }
.meter.over > div { background: var(--slip); }
.catrow { padding: 8px 0; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
.catrow:last-child { border-bottom: 0; }
.catline { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; font-size: 14px; }
.catline span:first-child { min-width: 0; overflow-wrap: anywhere; }
.catline span:last-child { white-space: nowrap; color: var(--muted); }
.twocol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
img { max-width: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

.pos { color: var(--good); } .neg { color: var(--slip); }
.accrow { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.accrow:last-child { border-bottom: 0; }
.accrow span:first-child { min-width: 0; overflow-wrap: anywhere; }

.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

.flabel { font-size: 13px; color: var(--muted); margin-bottom: 4px; display: block; }
.fgrid { display: grid; gap: 12px; }
.amount-in { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sumrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 14px; }

              el("div", { class: "catline" }, el("span", { text: c }), el("span", { text: fmtMoney(totals[c]) + " · " + pc + "%" })),
              el("div", { class: "meter" }, el("div", { style: "width:" + pc + "%" })));
          }), el("div", { class: "catrow" }, el("div", { class: "catline" }, el("b", { text: "Jami chiqim" }), el("b", { text: fmtMoney(catSum) }))))
        : el("div", { class: "empty", text: "Bu davrda chiqim yozuvi yo'q." }),
      el("div", { class: "small muted", text: "Turkum chiqim yozayotganda tanlanadi. Eski yozuvlar izohidagi so'zga qarab (tushlik, taksi, kitob...) o'zi taqsimlanadi." }));

    var sorted = money.tx.slice().sort(function (a, b) { return a.date === b.date ? (b.ts || 0) - (a.ts || 0) : (a.date < b.date ? 1 : -1); });
    var shown = sorted.slice(0, 100), txBox = el("div", {}), lastD = "";
    if (!shown.length) txBox.append(el("div", { class: "empty", text: "Hali yozuv yo'q. Yuqoridan birinchi kirim yoki chiqimni yozing." }));
    shown.forEach(function (t) {
      if (t.date !== lastD) {
        lastD = t.date;
        var di = 0, dout = 0;
        money.tx.forEach(function (x) { if (x.date === t.date && x.type !== "move") { if (x.type === "in") di += x.amount; else dout += x.amount; } });
        txBox.append(el("div", { class: "dayhead" }, fmtLong(parseKey(t.date)) + ", " + parseKey(t.date).getFullYear() + "  ", el("span", { class: "pos", text: "+" + group(di) }), " ", el("span", { class: "neg", text: "−" + group(dout) })));
      }
      var sign = t.type === "in" ? "+" : t.type === "out" ? "−" : "";
      var label = t.note || (t.type === "in" ? "Kirim" : t.type === "out" ? "Chiqim" : "O'tkazma");
      var where = t.type === "move" ? accName(t.acc) + " → " + accName(t.to) : accName(t.acc) + (t.type === "out" ? " · " + catOf(t) : "");
      txBox.append(el("div", { class: "txrow" },
        el("div", { class: "title", text: label }),
        el("div", { class: "amt " + (t.type === "in" ? "pos" : t.type === "out" ? "neg" : ""), text: sign + group(t.amount) }),
        el("div", { class: "sub", text: where }),
        el("div", {}),
        el("div", { class: "act" }, confirmTx === t.id
          ? [el("button", { class: "btn danger", text: "Ha, o'chir", onclick: function () { money.tx = money.tx.filter(function (x) { return x.id !== t.id; }); confirmTx = null; saveStore(); toast("O'chirildi"); renderAll(); } }),
             el("button", { class: "btn ghost", text: "Bekor", onclick: function () { confirmTx = null; renderAll(); } })]

    });
    var txCard = el("div", { class: "card" }, el("h2", { text: "Yozuvlar" }), txBox,
      sorted.length > 100 ? el("div", { class: "small muted", text: "Oxirgi 100 ta yozuv ko'rsatilgan. Hammasi zaxira faylida bor." }) : null);

    var accEdit = el("div", {}, money.accounts.map(function (a) {

      var openIn = el("input", { class: "field", type: "text", inputMode: "numeric", value: a.open ? group(a.open) : "", placeholder: "0", "aria-label": a.name + " boshlang'ich qoldiq" });
      openIn.addEventListener("input", function () { var d = digits(openIn.value); openIn.value = d ? group(parseInt(d, 10)) : ""; });

      return el("div", { class: "accwrap" }, el("div", { class: "accedit" }, nameIn, openIn,
        el("button", { class: "x", "aria-label": "Hisobni o'chirish", text: "×", onclick: function () {
          if (money.accounts.length <= 1) { toast("Kamida bitta hisob qolishi kerak", true); return; }
          if (money.tx.some(function (t) { return t.acc === a.id || t.to === a.id; })) { toast("Bu hisobda yozuvlar bor, o'chirib bo'lmaydi. Nomini o'zgartirishingiz mumkin.", true); return; }
          money.accounts = money.accounts.filter(function (x) { return x.id !== a.id; }); saveStore(); renderAll();
        } })), el("div", { class: "small muted", style: "padding: 0 2px 8px;", text: "Hozir qoldi: " + fmtMoney(accBalance(a.id)) }));
    }));
    var addAccIn = el("input", { class: "input", id: "new-acc", type: "text", placeholder: "Yangi hisob nomi", value: newAccName, "aria-label": "Yangi hisob nomi" });
    addAccIn.addEventListener("input", function () { newAccName = addAccIn.value; });
    function addAcc() {
      var v = newAccName.trim(); if (!v) return;
      money.accounts.push({ id: uid(), name: v, open: 0 }); newAccName = ""; saveStore(); renderAll();
    }
    addAccIn.addEventListener("keydown", function (e) { if (e.key === "Enter") addAcc(); });
    var accCard = el("div", { class: "card" },
      el("h2", { text: "Hisoblar" }),
      el("p", { class: "muted small", text: "Nomini o'zgartiring. O'ng tomondagi summa faqat boshlang'ich qoldiq: kirim va chiqim yozsangiz u o'zgarmaydi. Hozirgi qoldiq har hisobning tagida \"Hozir qoldi\" deb ko'rinadi." }),
      accEdit,
      el("div", { class: "addrow", style: "grid-template-columns: minmax(0, 1fr) auto;" }, addAccIn, el("button", { class: "btn", text: "Qo'shish", onclick: addAcc })));

    root.replaceChildren(el("div", { class: "wrap" }, balCard, formCard, limitCard, catCard, sumCard, txCard, accCard));
  }

  /* ===== ZAXIRA (sahifa pastida) ===== */
  var pendingImport = null;
  function backupJson() { return JSON.stringify({ app: "intizom-daftari", version: 2, days: days, notes: notes, config: config, money: money }, null, 2); }
  function markBackup() { config.lastBackup = todayKey(); saveStore(); renderFooter(); }
  function saveFile(name, text, type) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: type }));
      var a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast("Fayl yuklab olindi: " + name); markBackup();
    } catch (e) { toast("Fayl saqlanmadi", true); }
  }
  function shareBackup() {
    var f;
    try { f = new File([backupJson()], "intizom-daftari-" + todayKey() + ".json", { type: "application/json" }); } catch (e) { f = null; }
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
      navigator.share({ files: [f], title: "Intizom daftari zaxirasi" }).then(markBackup).catch(function (e) { if (!e || e.name !== "AbortError") toast("Ulashib bo'lmadi", true); });
    } else { toast("Bu qurilmada ulashish ishlamaydi. Faylni yuklab oling.", true); }
  }
  function readImport(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(String(r.result));
        if (!o || typeof o.days !== "object" || o.days === null || Array.isArray(o.days)) throw new Error("bad");
        pendingImport = o; renderFooter();
        var c = document.getElementById("import-confirm"); if (c && c.scrollIntoView) c.scrollIntoView({ block: "center" });
      } catch (e) { toast("Bu fayl intizom daftari zaxirasiga o'xshamaydi", true); }
    };
    r.onerror = function () { toast("Faylni o'qib bo'lmadi", true); };
    r.readAsText(file);
  }
  function applyImport() {
    var o = pendingImport; pendingImport = null;
    var clean = {};
    Object.keys(o.days).forEach(function (k) { var d = o.days[k]; if (d && /^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(d.tasks)) clean[k] = d; });
    days = clean;
    notes = Array.isArray(o.notes) ? o.notes : [];
    config = (o.config && typeof o.config === "object") ? o.config : { days: {} };
    if (!config.days) config.days = {};
    if (o.money && Array.isArray(o.money.accounts) && o.money.accounts.length && Array.isArray(o.money.tx)) money = o.money;
    fixMoney();
    drafts = {};
    saveStore(); toast("Zaxiradan tiklandi"); renderAll();
  }
  function renderFooter() {
    var root = document.getElementById("v-footer");
    var fileIn = el("input", { type: "file", id: "import-file", accept: ".json,application/json", hidden: true,
      onchange: function (e) { if (e.target.files[0]) readImport(e.target.files[0]); e.target.value = ""; } });
    var confirmCard = pendingImport ? el("div", { class: "card", id: "import-confirm" },
      el("h2", { text: "Zaxirani tiklash" }),
      el("p", { class: "muted", text: "Faylda " + Object.keys(pendingImport.days).length + " kunlik reja va " + (pendingImport.money && Array.isArray(pendingImport.money.tx) ? pendingImport.money.tx.length : 0) + " ta pul yozuvi bor. Hozirgi ma'lumotlar shu bilan almashtiriladi."}),
      el("div", { class: "btnrow" },
        el("button", { class: "btn danger", text: "Ha, almashtir", onclick: applyImport }),
        el("button", { class: "btn ghost", text: "Bekor", onclick: function () { pendingImport = null; renderFooter(); } }))) : null;
    root.replaceChildren(el("div", { class: "wrap" },
      confirmCard,
      el("div", { class: "card" },
        el("h2", { text: "Zaxira nusxa" }),
        el("p", { class: "muted small", text: "Hamma reja va pul yozuvlari faqat shu telefonda saqlanadi. Brauzer ma'lumotlarini tozalasangiz yoki ilovani o'chirsangiz yo'qoladi. Telefonni almashtirishdan oldin va vaqti-vaqti bilan zaxira oling." }),
        el("div", { class: "small " + (config.lastBackup ? "muted" : "neg"), text: config.lastBackup ? "Oxirgi zaxira: " + fmtLong(parseKey(config.lastBackup)) + ", " + parseKey(config.lastBackup).getFullYear() : "Hali zaxira olinmagan." }),
        el("div", { class: "btnrow" },
          el("button", { class: "btn", text: "Ma'lumotlarni yuklab olish (Backup)", onclick: function () { saveFile("intizom-daftari-" + todayKey() + ".json", backupJson(), "application/json"); } }),
          el("button", { class: "btn ghost", text: "Ulashish (Drive, Telegram...)", onclick: shareBackup }),
          el("button", { class: "btn ghost", text: "Tiklash (Restore)", onclick: function () { fileIn.click(); } }), fileIn))));
  }

  /* ===== ESLATMALAR ===== */
  var firedKey = "intizom-fired-v1", fired = {}, actx = null;
  function loadFired() { try { var o = JSON.parse(localStorage.getItem(firedKey) || "{}"); fired = (o.d === todayKey() && o.k) ? o.k : {}; } catch (e) { fired = {}; } }
  function saveFired() { try { localStorage.setItem(firedKey, JSON.stringify({ d: todayKey(), k: fired })); } catch (e) {} }
  function unlockAudio() {
    try {
      if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
      if (actx && actx.state === "suspended") actx.resume();
    } catch (e) {}
  }
  function beep() {
    unlockAudio(); if (!actx) return;
    try {
      var t0 = actx.currentTime;
      [0, 0.28, 0.56].forEach(function (o, i) {
        var osc = actx.createOscillator(), g = actx.createGain();
        osc.type = "sine"; osc.frequency.value = i === 2 ? 1040 : 880;
        g.gain.setValueAtTime(0.0001, t0 + o);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + o + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + o + 0.24);
        osc.connect(g); g.connect(actx.destination); osc.start(t0 + o); osc.stop(t0 + o + 0.26);
      });
    } catch (e) {}
  }
  function showSystemNote(title, body, tag) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    var opts = { body: body, tag: tag, icon: "icon-192.png", badge: "icon-192.png", renotify: true };
    function fallback() { try { new Notification(title, opts); } catch (e) {} }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration().then(function (reg) { if (reg && reg.showNotification) reg.showNotification(title, opts).catch(fallback); else fallback(); }).catch(fallback);
    } else fallback();
  }
  function notify(title, body, tag) {
    toast(title + ": " + body, false, 12000);
    beep();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    showSystemNote(title, body, tag);
  }
  function checkReminders() {
    if (!config.remind) return;
    var now = new Date(), tk = todayKey(), nowM = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    var d = days[tk] || newDay(tk), changed = false;
    d.tasks.forEach(function (t) {
      if (t.done) return;
      var m = toMin(t.time); if (m === null) return;
      var id = tk + "|" + t.time + "|" + String(t.text).slice(0, 30), diff = m - nowM;
      var label = t.time + (toMin(t.end) !== null ? " – " + t.end : "") + " · " + t.text;
      if (diff <= 0 && diff > -3) {
        if (!fired[id + "|go"]) { fired[id + "|go"] = 1; fired[id + "|pre"] = 1; changed = true; notify("Hozir boshlanadi", label, id + "|go"); }
      } else if (diff > 0 && diff <= 5) {
        if (!fired[id + "|pre"]) { fired[id + "|pre"] = 1; changed = true; notify(Math.ceil(diff) + " daqiqadan keyin", label, id + "|pre"); }
      }
    });
    if (changed) saveFired();
  }
  function updateBell() {
    var b = document.getElementById("bell");
    b.setAttribute("aria-pressed", config.remind ? "true" : "false");
    b.textContent = (config.remind ? "🔔" : "🔕") + " Eslatma";
    b.setAttribute("aria-label", config.remind ? "Eslatmalar yoqilgan, o'chirish" : "Eslatmalar o'chiq, yoqish");
  }
  function toggleReminders() {
    unlockAudio();
    if (config.remind) { config.remind = false; saveStore(); updateBell(); toast("Eslatmalar o'chirildi"); return; }
    config.remind = true; saveStore(); updateBell(); beep();
    var okMsg = "Eslatma yoqildi: vazifadan 5 daqiqa oldin va boshlanganda xabar va ovoz keladi. Ilova ochiq yoki fonda bo'lishi kerak.";
    if (!("Notification" in window)) toast("Bu brauzer bildirishnomani qo'llamaydi. Ilova ochiq paytida ovoz va xabar chiqadi.", false, 7000);
    else if (Notification.permission === "default") {
      Notification.requestPermission().then(function (p) {
        toast(p === "granted" ? okMsg : "Bildirishnoma ruxsati berilmadi. Ilova ochiq paytida ovoz va xabar chiqadi.", p !== "granted", 8000);
      }).catch(function () {});
    } else if (Notification.permission === "denied") toast("Bildirishnoma brauzer sozlamasida bloklangan. Ilova ochiq paytida ovoz va xabar chiqadi.", true, 8000);
    else toast(okMsg, false, 8000);
    checkReminders();
  }

  /* ===== render ===== */
  function renderAll() {
    renderTabs();
    ["bugun", "hafta", "intizom", "pul"].forEach(function (v) { document.getElementById("v-" + v).hidden = v !== view; });
    if (view === "bugun") renderBugun();
    else if (view === "hafta") renderHafta();
    else if (view === "intizom") renderIntizom();
    else renderPul();
    renderFooter(); updateBell(); fitAll();
  }

  /* ===== init ===== */
  function init() {
    var h = (location.hash || "").slice(1);
    if (TABS.some(function (t) { return t[0] === h; })) view = h;
    loadStore();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    loadFired();
    document.getElementById("bell").addEventListener("click", toggleReminders);
    document.addEventListener("pointerdown", unlockAudio, { once: true });
    window.addEventListener("resize", fitAll);
    renderAll(); setBanner();
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        if (lastToday !== todayKey()) { lastToday = todayKey(); sel = todayKey(); drafts = {}; loadFired(); renderAll(); }
        checkReminders();
      }
    });
    setInterval(checkReminders, 15000); checkReminders();
    if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
  }
  init();
})();
